  <!-- Application -->
  <script src="js/app.js"></script>
  <script>
    // Chrome de l'interface : logo, icône CTA, horloge système, XP, navigation interne.
    (function () {
      var logo = document.getElementById('nav-logo');
      if (logo && window.CODEX_ICON) logo.innerHTML = window.CODEX_ICON('logo');
      var ctaIc = document.getElementById('cta-ic');
      if (ctaIc && window.CODEX_ICON) ctaIc.innerHTML = window.CODEX_ICON('arrowRight');

      function refreshXp() {
        var n = document.getElementById('nav-xp');
        if (n && window.CX) n.textContent = window.CX.Store.totalXp() + ' XP';
      }
      refreshXp();
      window.addEventListener('hashchange', refreshXp);
      document.addEventListener('click', function () { setTimeout(refreshXp, 50); });

      // Horloge système (mono chrome).
      function pad(n) { return n < 10 ? '0' + n : '' + n; }
      function tick() {
        var c = document.getElementById('nav-clock');
        if (!c) return;
        var d = new Date();
        c.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      }
      tick();
      setInterval(tick, 1000);

      // Navigation interne : revient à l'index puis défile vers la section.
      document.querySelectorAll('[data-nav]').forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          var id = a.getAttribute('data-nav');
          function go() { var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
          if (location.hash && location.hash !== '#/' && location.hash !== '#') {
            location.hash = '#/';
            setTimeout(go, 90);
          } else { go(); }
        });
      });
    })();
  </script>
